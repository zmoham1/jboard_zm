name: Diagnose — SmartRecruiters

# Manual only. Probes SmartRecruiters endpoints from a runner with network
# access, to find why 299 of 323 boards return zero postings.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tools/diagnose_smartrecruiters.py
