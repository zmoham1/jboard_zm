name: Job Radar — Email Digest

on:
  schedule:
    # 3x/day, 8h apart — exactly one email per run. Cron is always UTC, so
    # these are anchored to US Eastern: 03/11/19 UTC = 11pm/7am/3pm EDT
    # (Mar–Nov). During EST (Nov–Mar) they land an hour earlier —
    # 10pm/6am/2pm — since GitHub cron does not follow daylight saving.
    - cron: "0 3,11,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Every workflow that commits a shared state database uses this one group.
# git cannot merge binary files, so two of them running at once produce an
# unresolvable rebase conflict on the SQLite file and the run dies:
#     CONFLICT (content): Merge conflict in state/gha-boards.db
# Serializing them is the fix; cancel-in-progress stays false so a queued run
# waits its turn rather than being dropped.
concurrency:
  group: job-radar-shared-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # One email covering every scanner: the priority/main DB is primary and
      # the boards DB is folded in via --digest-db.
      - name: Send consolidated digest
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DB_PATH: state/gha-jobs.db
        run: |
          python -m src.main --mode digest \
            --digest-db state/gha-boards.db \
            --notify-yes-only

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MAX_BYTES=$((95 * 1024 * 1024))
          if [ -f state/gha-jobs.db ]; then git add -f state/gha-jobs.db; fi
          if [ -f state/gha-boards.db ]; then
            DB_BYTES=$(wc -c < state/gha-boards.db)
            if [ "$DB_BYTES" -le "$MAX_BYTES" ]; then
              git add -f state/gha-boards.db
            else
              echo "::warning file=state/gha-boards.db::Skipping boards DB commit because ${DB_BYTES} bytes exceeds the 95 MiB safety threshold."
              git restore --worktree state/gha-boards.db
            fi
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update digest state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }}
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              # A binary conflict leaves the repo mid-rebase; without aborting,
              # every later attempt fails on the same unresolved state.
              git rebase --abort 2>/dev/null || true
              echo "Push race detected on attempt $attempt; retrying after a short pause."
              sleep 3
            fi
          done
          echo "State push failed after 3 attempts."
          exit 1
